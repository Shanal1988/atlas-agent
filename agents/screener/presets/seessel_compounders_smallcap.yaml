description: >
  Seessel compounders without the $2B size floor — the same growth, return and
  OEY tests applied to UK small caps (AIM + FTSE 250). A $100M floor keeps out
  micro caps where Yahoo data is thinnest.
universes: [uk_aim, uk_ftse250]
missing: fail
filters:
  - market_cap_usd >= 100M
  - sector not in Financial Services, Real Estate, Utilities
  - revenue_cagr >= 12%
  - roic_avg >= 15%
  - gross_margin >= 40%
  - fcf_margin >= 10%
  - oey_passes == true
rank:
  roic_avg: 0.25
  revenue_cagr: 0.25
  oey: 0.25
  gross_margin: 0.15
  operating_margin_change: 0.10
